name: Gerar APK Love Flix (Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK nativo do runner
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cache da chave de assinatura de teste (para manter atualizacoes compativeis)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: loveflix-debug-keystore-v1

      - name: Verificar keystore de producao (se configurado nos Secrets)
        id: keystore
        run: |
          if [ -n "${{ secrets.LOVEFLIX_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.LOVEFLIX_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK Love Flix
        working-directory: android
        env:
          LOVEFLIX_KEYSTORE_PASS: ${{ secrets.LOVEFLIX_KEYSTORE_PASS }}
          LOVEFLIX_KEY_ALIAS: ${{ secrets.LOVEFLIX_KEY_ALIAS }}
          LOVEFLIX_KEY_PASS: ${{ secrets.LOVEFLIX_KEY_PASS }}
        run: |
          if [ "${{ steps.keystore.outputs.has_release }}" = "true" ]; then
            LOVEFLIX_KEYSTORE_PATH="release.jks" gradle assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../LoveFlix.apk
          else
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../LoveFlix.apk
          fi

      - name: Publicar LoveFlix.apk para download
        uses: actions/upload-artifact@v4
        with:
          name: LoveFlix-APK
          path: LoveFlix.apk
          retention-days: 30
