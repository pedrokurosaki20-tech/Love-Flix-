name: Gerar APK Love Flix (Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cache da chave de assinatura de teste (para manter atualizacoes compativeis)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: loveflix-debug-keystore-v1

      - name: Verificar keystore de producao (se configurado nos Secrets)
        id: keystore
        run: |
          if [ -n "${{ secrets.LOVEFLIX_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.LOVEFLIX_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK Love Flix
        working-directory: android
        env:
          LOVEFLIX_KEYSTORE_PATH: ${{ steps.keystore.outputs.has_release == 'true' && 'release.jks' || '' }}
          LOVEFLIX_KEYSTORE_PASS: ${{ secrets.LOVEFLIX_KEYSTORE_PASS }}
          LOVEFLIX_KEY_ALIAS: ${{ secrets.LOVEFLIX_KEY_ALIAS }}
          LOVEFLIX_KEY_PASS: ${{ secrets.LOVEFLIX_KEY_PASS }}
        run: |
          if [ "${{ steps.keystore.outputs.has_release }}" = "true" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../LoveFlix.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../LoveFlix.apk
          fi

      - name: Publicar LoveFlix.apk para download
        uses: actions/upload-artifact@v4
        with:
          name: LoveFlix-APK
          path: LoveFlix.apk
          retention-days: 30
